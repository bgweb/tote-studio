px 0 0;z-index:0}.bagbody{width:100%;height:100%;background:#e9dcc6;border:2px solid #d6c3a5;border-radius:8px 8px 17px 17px;display:grid;place-items:center;position:relative;z-index:1;box-shadow:inset 0 0 35px #a7906a18}.printarea{width:88%;height:88%;position:relative;touch-action:none;overflow:hidden;background:#f8f0e2}canvas{display:block;width:100%;height:100%;touch-action:none}.printarea:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 7px #4e433014}.preview-note{font-size:11px;color:#8a8277;text-align:center;margin-top:9px}.bottom{height:71px;flex:none;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #e6ddd1;background:#fbf8f2}.bottom .btn{min-width:145px}.hint{color:#85877f;font-size:12px;text-align:center}.controls{display:flex;flex-direction:column;min-height:0;gap:10px;flex:1}.text-entry{display:flex;gap:8px}.text-entry input{flex:1;min-width:0;padding:12px;border:1px solid #dcd4c9;border-radius:12px}.editor{background:#f6f3ec;border:1px solid var(--line);padding:11px;border-radius:12px}.fieldtitle{font-weight:800;font-size:12px;margin:2px 0 7px}.fontgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fontbtn{border:1px solid #d9d4c9;background:white;border-radius:10px;min-height:57px;font-size:23px}.fontgrid{max-height:190px;overflow-y:auto}.fontbtn.on{border:2px solid var(--green);background:#e9f0e7}.swatches{display:flex;flex-wrap:wrap;gap:7px;max-height:122px;overflow-y:auto}.swatch{border:2px solid white;outline:1px solid #cfc9c0;width:29px;height:29px;border-radius:50%}.swatch.on{outline:3px solid var(--green)}.textlist{display:flex;flex-direction:column;gap:6px;max-height:95px;overflow-y:auto}.textrow{display:flex;align-items:center;gap:8px;border:1px solid #e4ded4;background:white;border-radius:9px;padding:6px 8px}.textrow.on{border:2px solid var(--green)}.textrow button{border:0;background:none;padding:5px;cursor:pointer}.textrow span{flex:1 </style></head><body><div class="app"><header><div><strong>◡ Tote Studio</strong> <small> &nbsp; DESIGN YOUR OWN TOTE BAG</small></div><div style="display:flex;gap:8px"><button class="reset" id="importDesign">Load design code</button><button class="reset" id="restart">Start again</button></div></header><nav class="steps" id="steps"></nav><main class="work"><section class="panel choices"><h1 class="title" id="heading"></h1><p class="subtitle" id="subheading"></p><div class="tabs" id="tabs"></div><div id="gallery" class="gallery"></div><div id="customControls" class="controls hidden"></div><div class="gallery-help" id="galleryHelp">Scroll to browse all designs ↓</div></section><section class="panel preview"><h3>Your bag, your way</h3><div class="bag"><div class="handles"></div><div class="bagbody"><div class="printarea"><canvas id="canvas" width="1000" height="1000"></canvas></div></div></div><div class="preview-note" id="previewNote">Choose a look to see it on your tote</div></section></main><footer class="bottom"><button class="btn" id="back">← Back</button><div class="hint" id="footHint">Your choices are saved as you go</div><button class="btn primary" id="next">Continue →</button></footer></div><script src="assets/catalogue.js"></script><script>
'use strict';const $=id=>document.getElementById(id), C=$('canvas'),ctx=C.getContext('2d');const names=['Background','Border','Text','Stickers','Review'];const titles=['Choose your background','Add a border','Make it personal','Add finishing touches','Review'];const subs=['Pick a colour or an illustrated theme.','Optional: choose a full, softly faded edge design.','Add one or more headings. Drag them on the bag.','Optional: choose stickers and move them around.','Check your finished design.'];const palette=['#f8f0e2','#f4c7ca','#c8b7df','#a7cee8','#b2c6a4','#203e37','#25334c','#a75b50','#d5a55c','#27272a','#ffffff','#e9c9aa'];const fontNames=['StudioBold','StudioSerif','StudioMono','StudioScript','Impact','Georgia','Trebuchet MS','Arial Black','StudioElegant','StudioSoft','StudioModern','StudioBookish','StudioHand'];const fontLabels=['Bold','Editorial','Mono','Script','Impact','Classic','Clean','Heavy','Elegant','Soft','Modern','Bookish','Handwritten'];let state={step:0,maxStep:0,bg:null,border:null,texts:[],stickers:[],selected:null,colour:'#f8f0e2',code:null};let tab='All',page=0,images={},drag=null;const PAGE=12;const catalogue=window.TOTE_ASSETS||{backgrounds:[],borders:[],stickers:[]};const getAssets=()=>state.step===0?catalogue.backgrounds:state.step===1?catalogue.borders:catalogue.stickers;function imageFor(src){if(!src)return null;if(!images[src]){let im=new Image();im.src=src;im.onload=draw;images[src]=im}return images[src].complete&&images[src].naturalWidth?images[src]:null}function getItem(id,kind){return (catalogue[kind]||[]).find(x=>x.id===id)}function allImages(){return [...catalogue.backgrounds,...catalogue.borders,...catalogue.stickers]}function save(){try{localStorage.setItem('tote-wizard-draft',JSON.stringify(state))}catch(e){}}function restore(){try{let x=JSON.parse(localStorage.getItem('tote-wizard-draft'));if(x&&Array.isArray(x.texts)&&Array.isArray(x.stickers)){state={...state,...x,step:0,maxStep:Math.min(4,x.maxStep||0),selected:null}}}catch(e){}}function update(){save();render();draw()}function changeStep(n){if(n<0||n>4||n>state.maxStep+1)return;state.step=n;state.maxStep=Math.max(state.maxStep,n);state.selected=null;tab='All';page=0;update()}function render(){ $('steps').innerHTML=names.map((n,i)=>`<button class="step ${i===state.step?'active':i<state.step?'done':''}" ${i>state.maxStep?'disabled':''} data-step="${i}"><span>${i<state.step?'✓':i+1}</span>${n}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>changeStep(+b.dataset.step));$('heading').textContent=titles[state.step];$('subheading').textContent=subs[state.step];$('back').disabled=state.step===0;$('next').textContent=state.step===4?'Finish & start again':'Continue →';$('tabs').classList.toggle('hidden',state.step>=2);$('gallery').classList.toggle('hidden',state.step===2||state.step===4);$('customControls').classList.toggle('hidden',state.step!==2&&state.step!==3&&state.step!==4);$('galleryHelp').classList.toggle('hidden',state.step===2||state.step===4);$('previewNote').textContent=state.step===2?'Drag text to move · drag a corner to resize · turn the round handle to rotate':state.step===3?'Drag stickers to move · drag a corner to resize · turn the round handle to rotate':'Your design updates instantly';if(state.step===2)renderText();else if(state.step===3){renderGallery();renderStickerControls()}else if(state.step===4)renderReview();else renderGallery()}
function renderGallery(){let list=getAssets(),groups=['All',...new Set(list.map(a=>a.category))];if(state.step===0)groups=['All','Colours',...groups.filter(x=>x!=='All')];$('tabs').innerHTML=groups.map(g=>`<button class="tab ${tab===g?'on':''}" data-tab="${g}">${g}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('gallery').scrollTop=0;renderGallery()});let items=list.filter(a=>tab==='All'||a.category===tab);if(state.step===0&&(tab==='All'||tab==='Colours'))items=[...palette.map((c,i)=>({id:'colour-'+i,name:['Natural','Blush','Lilac','Sky blue','Sage','Forest','Navy','Terracotta','Ochre','Charcoal','White','Sand'][i],colour:c})),...(tab==='All'?items:[])];if(state.step===1)items=[{id:'none',name:'No border',none:true},...items];if(state.step===3)items=[{id:'none',name:'No stickers',none:true},...items];const galleryEl=$('gallery');const oldScroll=galleryEl.scrollTop;let shown=items;$('gallery').innerHTML=shown.length?shown.map(a=>{let chosen=state.step===0?(a.colour?state.bg===null&&state.colour===a.colour:state.bg===a.id):state.step===1?state.border===(a.none?null:a.id):false;return `<button class="tile ${chosen?'selected':''}" data-id="${a.id}" aria-label="${a.colour?a.name:a.none?'None':'Artwork option'}">${a.colour?`<span class="colour" style="background:${a.colour}"></span>`:a.none?'<span style="font-size:30px;color:#a6a096">∅</span>':`<img src="${a.src}" alt="" loading="lazy">`}${a.colour?`<span class="name">${a.name}</span>`:''}${chosen?'<span class="check">✓</span>':''}</button>`}).join(''):`<div class="empty"><strong>No artwork yet</strong><span>Add 1.png (or 1.jpg / 1.webp) to assets/backgrounds, assets/borders or assets/stickers. Number files consecutively and refresh. If nothing appears, check that you opened index.html from the same folder as assets.</span></div>`;document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{let a=items.find(x=>x.id===b.dataset.id);if(state.step===0){if(a.colour){state.colour=a.colour;state.bg=null}else state.bg=a.id}else if(state.step===1){state.border=a.none?null:a.id}else if(state.step===3&&!a.none){state.stickers.push({id:(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(),asset:a.id,x:500,y:530,size:270,angle:0,flip:false});state.selected=state.stickers.at(-1).id}else if(state.step===3&&a.none){state.stickers=[];state.selected=null}update()});galleryEl.scrollTop=oldScroll}
function uploadFiles(files){for(const file of files){if(!file.type.startsWith('image/'))continue;let reader=new FileReader();reader.onload=()=>{let src=reader.result;let kind=state.step===0?'backgrounds':state.step===1?'borders':'stickers';let id='uploaded-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);catalogue[kind].push({id,name:file.name.replace(/\.[^.]+$/,''),category:'My artwork',src});tab='My artwork';$('gallery').scrollTop=0;renderGallery()};reader.readAsDataURL(file)}}function renderText(){let sel=state.texts.find(t=>t.id===state.selected);$('customControls').innerHTML=`<div class="text-entry"><input id="newText" maxlength="70" placeholder="Type a name, phrase or quote"><button class="btn primary" id="addText">+ Add text</button></div><div class="editor"><div class="fieldtitle">Your text</div><div class="textlist">${state.texts.length?state.texts.map(t=>`<div class="textrow ${state.selected===t.id?'on':''}"><button data-select="${t.id}" aria-label="Select text">✎</button><span>${escapeHTML(t.value)}</span><button data-remove="${t.id}" aria-label="Delete text">🗑 Delete</button></div>`).join(''):'<span class="small">Add your first line above. You can add several.</span>'}</div></div><div class="editor"><div class="fieldtitle">${sel?'Edit selected text':'Choose a text layer above to edit'}</div><input id="editText" value="${sel?escapeAttr(sel.value):''}" placeholder="Select a text layer" ${sel?'':'disabled'} style="width:100%;padding:9px;border:1px solid #ddd;border-radius:9px;margin-bottom:10px"><div class="fieldtitle">Font</div><div class="fontgrid">${fontNames.map((f,i)=>`<button class="fontbtn ${sel&&sel.font===f?'on':''}" style="font-family:'${f}'" data-font="${f}" ${sel?'':'disabled'} title="${fontLabels[i]}">Aa</button>`).join('')}</div><div class="fieldtitle" style="margin-top:12px">Text colour</div><div class="swatches">${['#193d33','#172b49','#111111','#ffffff','#9a3437','#cc7b7d','#6a5b91','#3279a4','#d8a747','#75462f','#ff6b6b','#ff9f1c','#ffe66d','#2ec4b6','#00a8e8','#4361ee','#7209b7','#f72585','#ffb3c6','#d4a373','#588157','#80b918','#b8c0ff','#e76f51','#a8dadc','#cdb4db','#f1faee','#8d99ae','#6d597a','#f4a261'].map(c=>`<button class="swatch ${sel&&sel.colour===c?'on':''}" style="background:${c}" data-colour="${c}" ${sel?'':'disabled'} aria-label="Colour ${c}"></button>`).join('')}</div><div style="margin-top:9px"><label class="small">Custom colour <input type="color" id="customColour" value="${sel?sel.colour:'#193d33'}" ${sel?'':'disabled'} style="vertical-align:middle;width:48px;height:30px"></label></div>${sel?`<div class="small" style="margin-top:12px">Select text on the bag. Drag a corner to resize or the round handle to rotate.</div>`:''}</div>`;$('addText').onclick=()=>{let v=$('newText').value.trim();if(!v)return;let id='t'+Date.now();state.texts.push({id,value:v,font:'StudioBold',colour:'#193d33',x:500,y:state.texts.length?650:470,size:100,angle:0});state.selected=id;update()};$('newText').onkeydown=e=>{if(e.key==='Enter')$('addText').click()};document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.select;update()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.texts=state.texts.filter(t=>t.id!==b.dataset.remove);state.selected=null;update()});if(sel){$('editText').oninput=e=>{sel.value=e.target.value;save();draw()};$('editText').onchange=update;document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{sel.font=b.dataset.font;update()});document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{sel.colour=b.dataset.colour;update()});$('customColour').oninput=e=>{sel.colour=e.target.value;save();draw()};}}

function splitCode(code){let pieces=[];for(let i=0;i<code.length;i+=qrSize)pieces.push(code.slice(i,i+qrSize));if(pieces.length>99)throw Error('Design too large for QR transfer');let id=(Math.random().toString(36).slice(2,8)).toUpperCase();return pieces.map((p,i)=>'TQ1|'+id+'|'+(i+1)+'|'+pieces.length+'|'+p)}
function qrSVG(value){let qr=new ToteQR.QRCode(-1,ToteQR.L);qr.addData(value);qr.make();let n=qr.getModuleCount(),rects=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))rects.push('<rect x="'+x+'" y="'+y+'" width="1" height="1"/>');return '<svg role="img" aria-label="Design QR code" viewBox="-4 -4 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-4" y="-4" width="'+(n+8)+'" height="'+(n+8)+'" fill="white"/><g fill="black">'+rects.join('')+'</g></svg>'}
function showPart(){if(!chunks.length)return;$qr('qrImage').innerHTML=qrSVG(chunks[index]);$qr('qrPart').textContent='Scan '+(index+1)+' of '+chunks.length;$qr('qrPrev').disabled=index===0;$qr('qrNext').disabled=index===chunks.length-1}
function showStaff(){try{chunks=splitCode(encodeDesign());index=0;$qr('staffOverlay').classList.add('open');showPart()}catch(e){alert('Unable to prepare design: '+e.message)}}
function closeStaff(){$qr('staffOverlay').classList.remove('open')}
function initStaff(){const overlay=document.createElement('div');overlay.id='staffOverlay';overlay.className='staff-overlay';overlay.innerHTML='<div class="staff-dialog" role="dialog" aria-modal="true" aria-label="Staff design transfer"><button type="button" class="staff-close" id="qrCloseX" aria-label="Close staff transfer">×</button><h2 style="margin:0 0 8px">Staff transfer</h2><p class="qr-hint">Scan each QR in order using the printing laptop webcam. Use Next after each successful scan.</p><div id="qrImage" class="qr-card"></div><p id="qrPart" style="font-weight:800"></p><div class="qr-actions"><button class="btn" id="qrPrev">← Previous</button><button class="btn primary" id="qrNext">Next →</button><button class="btn" id="qrClose">Back to design</button></div><details style="margin-top:14px;text-align:left"><summary class="qr-hint">Backup: show design code</summary><textarea id="staffCode" readonly style="width:100%;min-height:85px;font:12px monospace"></textarea><button class="btn" id="staffCopy">Copy code</button></details></div>';document.body.append(overlay);$qr('qrClose').onclick=closeStaff;$qr('qrCloseX').onclick=closeStaff;$qr('qrPrev').onclick=()=>{index--;showPart()};$qr('qrNext').onclick=()=>{index++;showPart()};$qr('staffCopy').onclick=()=>{let el=$qr('staffCode');el.select();document.execCommand('copy')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStaff()});
// Intercept review rendering: the QR controls are hidden until staff triple-tap the word design.
const oldRenderReview=renderReview;
renderReview=function(){oldRenderReview();let panel=$qr('customControls');panel.innerHTML='<div class="review"><h2>Your <button type="button" id="readySecret" class="ready-trigger" aria-label="design">design</button> is ready! ✨</h2><p>Show this screen to a member of staff.</p><button class="btn" id="reviewBack">← Change something</button></div>';$qr('reviewBack').onclick=()=>changeStep(3);let secretTaps=0,lastSecretTap=0;$qr('readySecret').addEventListener('click',()=>{const now=Date.now();secretTaps=now-lastSecretTap<1600?secretTaps+1:1;lastSecretTap=now;if(secretTaps>=3){secretTaps=0;$qr('staffCode').value=encodeDesign();showStaff()}})};
}
function status(t){$qr('scanStatus').textContent=t}
function acceptQR(raw){let m=/^TQ1\|([A-Z0-9]+)\|(\d+)\|(\d+)\|([A-Za-z0-9_-]+)$/.exec(raw);if(!m){status('This is not a Tote Studio QR code.');return}let [_,id,num,total,data]=m;num=+num;total=+total;if(total<1||total>99||num<1||num>total)return status('Invalid QR part');if(session!==id){seen.clear();session=id}seen.set(num,data);status('Received '+seen.size+' of '+total+' parts. '+(seen.size<total?'Show the next QR on the Chromebook.':'Reconstructing design…'));if(seen.size===total){let code=Array.from({length:total},(_,i)=>seen.get(i+1)).join('');try{let d=decodeDesign(code);Object.assign(state,d,{step:4,maxStep:4,selected:null});save();render();draw();status('Design loaded successfully! Check preview, then save PNG.');stopCamera()}catch(e){status('QR parts collected but design is invalid: '+e.message)}}}
async function startCamera(){if(!('BarcodeDetector' in window)){status('This browser does not support webcam QR detection. Try Chrome/Edge, or use the manual code option.');return}try{scanner=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});let v=$qr('scanVideo');v.srcObject=stream;await v.play();scanning=true;status('Camera running. Hold the customer screen in front of the webcam.');scanLoop()}catch(e){status('Cannot start webcam: '+e.message+'. Try opening via http://localhost instead of a file.')}}
async function scanLoop(){let video=$qr('scanVideo');while(scanning){try{if(video.readyState>=2){let codes=await scanner.detect(video);for(let item of codes){if(item.rawValue&&item.rawValue.startsWith('TQ1|')){let m=/^TQ1\|([^|]+)\|(\d+)\|/.exec(item.rawValue);if(m&&(!seen.has(+m[2])||session!==m[1]))acceptQR(item.rawValue)}}}}catch(e){status('Camera scanning error: '+e.message);break}await new Promise(r=>setTimeout(r,220))}}
function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}let v=$qr('scanVideo');if(v)v.srcObject=null}
function initDecoder(){let bar=document.createElement('div');bar.style.cssText='padding:10px 15px;background:#e7f0e8;border-bottom:1px solid #cad8cc;display:flex;flex-wrap:wrap;align-items:center;gap:10px';bar.innerHTML='<strong>Printing laptop · QR decoder</strong><button class="btn primary" id="startScan">Start webcam scan</button><button class="btn" id="stopScan">Stop camera</button><button class="btn" id="manualLoad">Enter backup code</button><span id="scanStatus" role="status">Ready to scan.</span><video id="scanVideo" playsinline muted style="width:170px;max-height:110px"></video>';document.querySelector('header').after(bar);$qr('startScan').onclick=startCamera;$qr('stopScan').onclick=()=>{stopCamera();status('Camera stopped.')};$qr('manualLoad').onclick=()=>{let code=prompt('Paste the complete TS1/TS2 design code:');if(!code)return;try{let d=decodeDesign(code);Object.assign(state,d,{step:4,maxStep:4,selected:null});save();render();draw();status('Design loaded from code.')}catch(e){status('Invalid code: '+e.message)}};
const oldReview=renderReview;renderReview=function(){oldReview();let panel=$qr('customControls');panel.innerHTML='<div class="review"><h2>Design preview</h2><p>Check the artwork, then export the image for printing.</p><button class="btn primary" id="savePng">Save print PNG</button><button class="btn" id="saveCode">Save design code</button></div>';$qr('savePng').onclick=()=>{state.selected=null;draw();C.toBlob(b=>{if(b)downloadBlob(b,'tote-design.png')},'image/png')};$qr('saveCode').onclick=()=>downloadBlob(new Blob([encodeDesign()],{type:'text/plain'}),'tote-design.txt')};state.step=4;state.maxStep=4;render();draw();window.addEventListener('beforeunload',stopCamera)}
if(isDecoder)initDecoder();else initStaff();
})();
</script></body></html>

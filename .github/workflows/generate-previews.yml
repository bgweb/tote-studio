name: Generate Tote Studio thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'assets/backgrounds/**'
      - 'assets/borders/**'
      - 'assets/stickers/**'
      - 'scripts/generate_previews.py'
      - '.github/workflows/generate-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate all thumbnails
        run: python scripts/generate_previews.py
      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/previews
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Tote Studio previews"
            git push
          else
            echo "All thumbnails are already up to date."
          fi
